{% extends 'base.html' %}
{% block title %} Register - OPTIWAR {% endblock %}
{% block content %}

<div class="auth-container">
    <h2>{{ _('Create Your Account') }}</h2>

    <div class="google-login-section">
        <a href="{{ url_for('auth.google_login') }}" class="google-btn">
            <svg width="20" height="20" viewBox="0 0 48 48" style="margin-right: 10px; vertical-align: middle;">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            {{ _('Sign up with Google') }}
        </a>
    </div>

    <div class="auth-divider">
        <span>{{ _('OR') }}</span>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form">
        <label for="name">{{ _('Full Name') }}</label>
        <input type="text" id="name" name="name" placeholder="{{ _('Your full name') }}" required>

        <label for="email">{{ _('Email Address') }}</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>

        <label for="phone">{{ _('Phone Number') }}</label>
        <input type="tel" id="phone" name="phone" placeholder="Your phone number">

        <label for="password">{{ _('Password') }}</label>
        <input type="password" id="password" name="password" placeholder="Min 6 characters" required minlength="6">

        <label for="confirm_password">{{ _('Confirm Password') }}</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="6">

        <div class="captcha-section">
            <label for="captcha">Enter the text shown below:</label>
            <img src="data:image/png;base64,{{ captcha_image }}" alt="CAPTCHA" class="captcha-img">
            <input type="text" id="captcha" name="captcha" placeholder="Enter CAPTCHA" required>
        </div>

        <button type="submit" class="auth-submit-btn">Create Account</button>
    </form>

    <div class="auth-switch">
        <p>{{ _('Already have an account?') }} <a href="{{ url_for('auth.login') }}">{{ _('Login here') }}</a></p>
    </div>
</div>

{% endblock %}
