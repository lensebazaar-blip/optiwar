{% extends 'base.html' %}
{% block title %}Set your Optiwar password{% endblock %}
{% block content %}
<main class="password-update">
    <div class="password-card">
        <span class="eyebrow">ACCOUNT SECURITY</span>
        <h1>Set your password</h1>
        <p>Your temporary password is valid for 7 days. Choose a new password to continue.</p>
        <form method="POST" action="{{ url_for('main.set_password') }}"
              data-disable-on-submit>
            <label for="password">New password</label>
            <input id="password" name="password" type="password" minlength="8"
                   autocomplete="new-password" required>
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="confirm_password" type="password"
                   minlength="8" autocomplete="new-password" required>
            <button type="submit">Save password</button>
        </form>
        <a class="logout-link" href="{{ url_for('auth.logout') }}">Log out</a>
    </div>
</main>
<style>
.password-update { min-height: 65vh; display: grid; place-items: center;
    padding: 24px 16px; background: #f7f6fb; }
.password-card { width: min(100%, 470px); box-sizing: border-box;
    padding: 32px; border: 1px solid #ebe8f3; border-radius: 20px;
    background: #fff; box-shadow: 0 14px 45px rgba(39, 27, 83, .08); }
.password-card .eyebrow { color: #6954cf; font-size: 11px; font-weight: 700;
    letter-spacing: 1.2px; }
.password-card h1 { margin: 10px 0 8px; font-size: 26px; }
.password-card p { color: #62616a; line-height: 1.5; }
.password-card label { display: block; margin: 18px 0 6px; font-weight: 600; }
.password-card input { width: 100%; box-sizing: border-box; padding: 12px;
    border: 1px solid #d9d6e3; border-radius: 9px; font-size: 16px; }
.password-card button { width: 100%; margin-top: 22px; padding: 13px;
    border: 0; border-radius: 9px; background: #5b3df5; color: #fff;
    font-weight: 700; cursor: pointer; }
.password-card button:disabled { opacity: .65; cursor: wait; }
.logout-link { display: block; margin-top: 18px; text-align: center; color: #6252bb; }
@media (max-width: 520px) { .password-card { padding: 24px 20px; } }
</style>
<script>
document.querySelectorAll("[data-disable-on-submit]").forEach(function(form) {
    form.addEventListener("submit", function() {
        var button = form.querySelector("button[type=submit]");
        if (button) { button.disabled = true; button.textContent = "Saving…"; }
    });
});
</script>
{% endblock %}
