<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <linearGradient id="owGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#000000"/>
            <stop offset="100%" stop-color="#333333"/>
        </linearGradient>
        
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="400" height="200" fill="#f8f8f8"/>
    
    <!-- OW Branded Container -->
    <rect x="50" y="30" width="300" height="140" rx="8" fill="url(#owGradient)" stroke="#555" stroke-width="1"/>
    "/>
    
    <!-- Lens Specs -->
    <g text-anchor="middle" font-family="Arial" fill="#ffffff">
        <text x="200" y="110" font-size="28" font-weight="bold" filter="url()"> Thin index</text>
        <text x="200" y="140" font-size="24">Anti Glare Light</text>
    </g>
    
    <!-- Certification Badge -->
    <circle cx="340" cy="70" r="20" fill="#e74c3c"/>
    <text x="340" y="74" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">HD</text>
</svg>
