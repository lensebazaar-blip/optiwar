<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Green lens gradients -->
        <radialGradient id="greenLens" cx="60%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#a5d6a7" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#4caf50" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#2e7d32" stop-opacity="0.4"/>
        </radialGradient>

        <!-- Anti-glare filter -->
        <filter id="greenAR" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
            <feColorMatrix in="blur" type="matrix"
                values="0.7 0 0 0 0
                        0 0.9 0 0 0
                        0 0 0.7 0 0
                        0 0 0 12 -3"/>
            <feComposite in2="SourceGraphic" operator="over"/>
        </filter>

        <!-- Glare simulation -->
        <g id="glareBeam">
            <rect x="-150" y="-5" width="300" height="10" fill="url(#glareGradient)"
                  transform="rotate(45)">
                <animateMotion path="M0,0 Q50,50 0,100" dur="3s" repeatCount="indefinite"/>
            </rect>
        </g>
        <linearGradient id="glareGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="white" stop-opacity="0"/>
            <stop offset="40%" stop-color="white" stop-opacity="0.9"/>
            <stop offset="60%" stop-color="white" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </linearGradient>

        <!-- Nano-coating pattern -->
        <pattern id="greenCoating" patternUnits="userSpaceOnUse" width="6" height="6">
            <circle cx="3" cy="3" r="0.5" fill="#81c784" opacity="0.15"/>
        </pattern>
    </defs>

    <!-- Metallic frame -->
    <path d="M80,150 Q80,90 150,90 Q220,90 220,150 Q220,210 150,210 Q80,210 80,150 Z"
          fill="#424242" stroke="#212121" stroke-width="2"/>

    <!-- Green anti-glare lens -->
    <g filter="url(#greenAR)">
        <path d="M100,150 Q100,100 150,100 Q200,100 200,150 Q200,200 150,200 Q100,200 100,150 Z"
              fill="url(#greenLens)"/>

        <!-- Multi-layer coating -->
        <path d="M100,150 Q100,100 150,100 Q200,100 200,150 Q200,200 150,200 Q100,200 100,150 Z"
              fill="url(#greenCoating)" opacity="0.3"/>

        <!-- Edge clarity indicator -->
        <path d="M100,150 Q100,100 150,100" fill="none" stroke="#e8f5e9" stroke-width="0.8" stroke-dasharray="2,1"/>

        <!-- Animated glare reduction demo -->
        <g transform="translate(150,150)" opacity="0">
            <use href="#glareBeam"/>
            <animate attributeName="opacity" values="0;0.8;0" begin="mouseover" dur="2s" fill="freeze"/>
        </g>
    </g>

    <!-- Interactive control -->
    <g transform="translate(320,50)" cursor="pointer">
        <rect x="-30" y="-15" width="60" height="30" rx="5" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Anti-Glare Lenses</text>
        <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="1s" repeatCount="indefinite" additive="sum"/>
    </g>

    <!-- Technical labeling -->
    <text x="200" y="260" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2e7d32">
        GREEN ANTI-GLARE LENS
    </text>
    <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#4caf50">
        90% Glare reduction
    </text>

    <!-- Animation instructions -->
    <text x="200" y="40" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">
        Hover over "Test Glare" to see anti-reflective properties
    </text>
</svg>
